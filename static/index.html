<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Route Extraction</title>
    <style>
        :root {
            --bg:       #f0f4f8;
            --panel:    #ffffff;
            --panel-2:  #f8fafc;
            --line:     rgba(0,0,0,0.09);
            --text:     #1e293b;
            --muted:    #64748b;
            --accent:   #3b82f6;
            --accent-2: #1d4ed8;
            --danger:   #ef4444;
            --success:  #16a34a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            color: var(--text);
            background:
                radial-gradient(circle at 10% 0%,  rgba(59,130,246,0.08), transparent 26%),
                radial-gradient(circle at 90% 100%, rgba(29,78,216,0.06),  transparent 30%),
                var(--bg);
            font-family: "Segoe UI", "Apple SD Gothic Neo", sans-serif;
            padding: 20px;
            min-height: 100vh;
        }

        .app {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ── Header ─────────────────────────────────────────────────────── */
        .app-header h1 {
            font-size: clamp(1.6rem, 2.2vw, 2.4rem);
            letter-spacing: -0.03em;
        }
        .app-header .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        /* ── Main 2-column grid ─────────────────────────────────────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }

        /* ── Left column ────────────────────────────────────────────────── */
        .left-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Upload area */
        .upload-area {
            border: 1.5px dashed rgba(59,130,246,0.5);
            border-radius: 14px;
            background: rgba(59,130,246,0.04);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.18s;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .upload-area:hover,
        .upload-area.drag-over {
            background: rgba(59,130,246,0.09);
        }
        .upload-area.has-image {
            border-style: solid;
            border-color: rgba(22,163,74,0.5);
            padding: 10px;
            justify-content: stretch;
        }
        .upload-area.has-image img {
            display: block;
            width: 100%;
            flex: 1;
            min-height: 0;
            object-fit: contain;
            border-radius: 8px;
        }
        .upload-title { font-weight: 700; font-size: 0.95rem; }
        .upload-hint  { color: var(--muted); font-size: 0.82rem; }

        /* Pipeline stages */
        .pipeline {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .stage-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 12px 14px;
            transition: border-color 0.2s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .stage-card.running { border-color: rgba(59,130,246,0.5); }
        .stage-card.success { border-color: rgba(22,163,74,0.4); }
        .stage-card.error   { border-color: rgba(239,68,68,0.45); }

        .stage-connector {
            width: 2px;
            height: 10px;
            background: var(--line);
            margin: 0 auto;
        }

        .stage-head {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stage-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 0.82rem;
            flex: 0 0 auto;
            transition: background 0.2s, color 0.2s;
        }
        .stage-badge.pending { background: rgba(0,0,0,0.07); color: var(--muted); }
        .stage-badge.running { background: var(--accent); color: #fff; animation: pulse 1.2s ease infinite; }
        .stage-badge.success { background: var(--success); color: #fff; }
        .stage-badge.error   { background: var(--danger);  color: #fff; }
        .stage-badge.placeholder { background: rgba(0,0,0,0.05); color: rgba(0,0,0,0.25); }

        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 3px rgba(59,130,246,0.2); }
            50%      { box-shadow: 0 0 0 6px rgba(59,130,246,0.06); }
        }

        .stage-info { flex: 1; min-width: 0; }
        .stage-name { font-weight: 700; font-size: 0.9rem; }
        .stage-status {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .stage-status.running-text { color: var(--accent); }
        .stage-status.success-text { color: var(--success); }
        .stage-status.error-text   { color: var(--danger); }

        .stage-body {
            margin-top: 10px;
        }
        .stage-body img {
            display: block;
            width: 100%;
            max-height: 110px;
            object-fit: contain;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.08);
            background: #f1f5f9;
        }
        .stage-card.image-stage .stage-body {
            min-height: 350px;
        }
        .stage-card.image-stage .stage-body img {
            max-height: 350px;
        }

        #stage2 .stage-body,
        #stage3 .stage-body,
        #stage4 .stage-body {
            min-height: 350px;
        }

        #stage2 .stage-body img,
        #stage3 .stage-body img,
        #stage4 .stage-body img {
            max-height: 350px;
        }

        .stage-placeholder {
            height: 48px;
            border-radius: 8px;
            border: 1px dashed rgba(0,0,0,0.12);
            background: rgba(0,0,0,0.02);
            display: grid;
            place-items: center;
            color: rgba(0,0,0,0.3);
            font-size: 0.82rem;
        }

        .stage-error-msg {
            margin-top: 6px;
            padding: 6px 9px;
            border-radius: 8px;
            border: 1px solid rgba(239,68,68,0.35);
            background: rgba(239,68,68,0.07);
            color: #b91c1c;
            font-size: 0.82rem;
            display: none;
        }
        .stage-error-msg.show { display: block; }

        /* ── Right column ───────────────────────────────────────────────── */
        .right-col {
            position: sticky;
            top: 20px;
        }

        .gpx-panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .gpx-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .gpx-panel-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
        }

        .btn {
            border: none;
            color: #fff;
            border-radius: 10px;
            padding: 9px 16px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            transition: transform 0.15s, opacity 0.15s;
            white-space: nowrap;
        }
        .btn:hover:not(:disabled) { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.38; cursor: not-allowed; }
        .btn.success { background: linear-gradient(135deg, #22c55e, #16a34a); }

        /* GPX viewer */
        .gpx-viewer {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background:
                linear-gradient(45deg,  rgba(0,0,0,0.03) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(0,0,0,0.03) 25%, transparent 25%),
                linear-gradient(45deg,  transparent 75%, rgba(0,0,0,0.03) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(0,0,0,0.03) 75%),
                #f1f5f9;
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0;
            border: 1px solid rgba(0,0,0,0.08);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gpx-placeholder {
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
            line-height: 1.6;
            padding: 20px;
        }
        .gpx-placeholder-icon {
            font-size: 2.4rem;
            margin-bottom: 10px;
            opacity: 0.5;
        }

        #gpxOverlayImg {
            display: none;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 12px;
        }

        /* GPX stats */
        .gpx-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .stat-box {
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
        }
        .stat-label {
            color: var(--muted);
            font-size: 0.75rem;
            margin-bottom: 3px;
        }
        .stat-value {
            font-weight: 700;
            font-size: 0.9rem;
        }
        .stat-value.start-color { color: #1d4ed8; }
        .stat-value.end-color   { color: #dc2626; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(59,130,246,0.25);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: -2px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Responsive ─────────────────────────────────────────────────── */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .right-col { position: static; }
        }
    </style>
</head>
<body>
<div class="app">

    <header class="app-header">
        <h1>Marathon Route Extraction</h1>
        <div class="subtitle">이미지를 업로드하면 자동으로 경로를 추출하고 GPX를 생성합니다.</div>
    </header>

    <div class="main-grid">

        <!-- ── Left column ──────────────────────────────────────────────── -->
        <div class="left-col">

            <!-- Upload area -->
            <div class="upload-area" id="uploadArea">
                <div class="upload-title">클릭하거나 이미지를 드롭하세요</div>
                <div class="upload-hint">JPG / PNG</div>
            </div>
            <input type="file" id="imageInput" accept="image/*" style="display:none">

            <!-- Pipeline stages -->
            <div class="pipeline">

                <!-- Stage 1: 이미지 입력 -->
                <div class="stage-card" id="stage1">
                    <div class="stage-head">
                        <div class="stage-badge pending" id="badge1">1</div>
                        <div class="stage-info">
                            <div class="stage-name">이미지 입력</div>
                            <div class="stage-status" id="status1">대기 중</div>
                        </div>
                    </div>
                    <div class="stage-body" id="body1"></div>
                    <div class="stage-error-msg" id="error1"></div>
                </div>

                <div class="stage-connector"></div>

                <!-- Stage 2: 경로 추출 (predict) -->
                <div class="stage-card image-stage" id="stage2">
                    <div class="stage-head">
                        <div class="stage-badge pending" id="badge2">2</div>
                        <div class="stage-info">
                            <div class="stage-name">경로 추출</div>
                            <div class="stage-status" id="status2">대기 중</div>
                        </div>
                    </div>
                    <div class="stage-body" id="body2"></div>
                    <div class="stage-error-msg" id="error2"></div>
                </div>

                <div class="stage-connector"></div>

                <!-- Stage 3: 후처리 (postprocess + auto extract path) -->
                <div class="stage-card image-stage" id="stage3">
                    <div class="stage-head">
                        <div class="stage-badge pending" id="badge3">3</div>
                        <div class="stage-info">
                            <div class="stage-name">후처리</div>
                            <div class="stage-status" id="status3">대기 중</div>
                        </div>
                    </div>
                    <div class="stage-body" id="body3"></div>
                    <div class="stage-error-msg" id="error3"></div>
                </div>

                <div class="stage-connector"></div>

                <!-- Stage 4: 경로 오버레이 -->
                <div class="stage-card image-stage" id="stage4">
                    <div class="stage-head">
                        <div class="stage-badge pending" id="badge4">4</div>
                        <div class="stage-info">
                            <div class="stage-name">경로 오버레이</div>
                            <div class="stage-status" id="status4">대기 중</div>
                        </div>
                    </div>
                    <div class="stage-body" id="body4"></div>
                    <div class="stage-error-msg" id="error4"></div>
                </div>

                <div class="stage-connector"></div>

                <!-- Stage 5: OCR 추출 (placeholder) -->
                <div class="stage-card" id="stage5">
                    <div class="stage-head">
                        <div class="stage-badge placeholder" id="badge5">5</div>
                        <div class="stage-info">
                            <div class="stage-name">OCR 추출</div>
                            <div class="stage-status" id="status5">향후 구현 예정</div>
                        </div>
                    </div>
                    <div class="stage-body">
                        <div class="stage-placeholder">Hi-SAM + PaddleOCR 텍스트 인식 영역</div>
                    </div>
                </div>

                <div class="stage-connector"></div>

                <!-- Stage 6: 좌표 변환 (placeholder) -->
                <div class="stage-card" id="stage6">
                    <div class="stage-head">
                        <div class="stage-badge placeholder" id="badge6">6</div>
                        <div class="stage-info">
                            <div class="stage-name">좌표 변환</div>
                            <div class="stage-status" id="status6">향후 구현 예정</div>
                        </div>
                    </div>
                    <div class="stage-body">
                        <div class="stage-placeholder">카카오 API + 호모그래피 변환 영역</div>
                    </div>
                </div>

            </div><!-- .pipeline -->
        </div><!-- .left-col -->

        <!-- ── Right column ─────────────────────────────────────────────── -->
        <div class="right-col">
            <div class="gpx-panel">

                <div class="gpx-panel-header">
                    <h2>GPX 결과</h2>
                    <button class="btn success" id="downloadGpxBtn" disabled>GPX 다운로드</button>
                </div>

                <div class="gpx-viewer" id="gpxViewer">
                    <div class="gpx-placeholder" id="gpxPlaceholder">
                        <div class="gpx-placeholder-icon">🗺</div>
                        <div>이미지를 업로드하면<br>경로가 시각화됩니다</div>
                    </div>
                    <img id="gpxOverlayImg" alt="경로 시각화">
                </div>

                <div class="gpx-stats" id="gpxStats" style="display:none">
                    <div class="stat-box">
                        <div class="stat-label">경로 포인트</div>
                        <div class="stat-value" id="statPoints">—</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">시작점</div>
                        <div class="stat-value start-color" id="statStart">—</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">끝점</div>
                        <div class="stat-value end-color" id="statEnd">—</div>
                    </div>
                </div>

            </div><!-- .gpx-panel -->
        </div><!-- .right-col -->

    </div><!-- .main-grid -->
</div><!-- .app -->

<script>
    const state = {
        uploadedImage:    null,   // base64 data URL
        mask_b64:         null,
        skeleton_b64:     null,
        start:            null,   // [x, y]
        end:              null,   // [x, y]
        path:             [],
        homography_params: null,
        gpxContent:       null,
        pipelineRunning:  false,
    };

    // ── DOM refs ──────────────────────────────────────────────────────────────
    const uploadArea     = document.getElementById('uploadArea');
    const imageInput     = document.getElementById('imageInput');
    const downloadGpxBtn = document.getElementById('downloadGpxBtn');
    const gpxPlaceholder = document.getElementById('gpxPlaceholder');
    const gpxOverlayImg  = document.getElementById('gpxOverlayImg');
    const gpxStats       = document.getElementById('gpxStats');

    // ── Stage helpers ─────────────────────────────────────────────────────────
    function setStage(n, stateClass, statusText, isRunning = false) {
        const card   = document.getElementById(`stage${n}`);
        const badge  = document.getElementById(`badge${n}`);
        const status = document.getElementById(`status${n}`);

        card.className  = `stage-card ${stateClass}`;
        badge.className = `stage-badge ${stateClass}`;

        if (stateClass === 'success') badge.textContent = '✓';
        else if (stateClass === 'error') badge.textContent = '✗';
        else badge.textContent = String(n);

        status.className = `stage-status ${stateClass}-text`;
        if (isRunning) {
            status.innerHTML = `<span class="spinner"></span>${statusText}`;
        } else {
            status.textContent = statusText;
        }
    }

    function setStageBody(n, html) {
        document.getElementById(`body${n}`).innerHTML = html;
    }

    function setStageError(n, msg) {
        const el = document.getElementById(`error${n}`);
        el.textContent = msg;
        el.classList.add('show');
    }

    function clearStageError(n) {
        const el = document.getElementById(`error${n}`);
        if (el) { el.textContent = ''; el.classList.remove('show'); }
    }

    function thumbHtml(src, alt) {
        return `<img src="${src}" alt="${alt}">`;
    }

    // ── Upload handling ───────────────────────────────────────────────────────
    uploadArea.addEventListener('click', () => imageInput.click());

    uploadArea.addEventListener('dragover', e => {
        e.preventDefault();
        uploadArea.classList.add('drag-over');
    });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
        e.preventDefault();
        uploadArea.classList.remove('drag-over');
        if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });
    imageInput.addEventListener('change', () => {
        if (imageInput.files[0]) handleFile(imageInput.files[0]);
    });

    function handleFile(file) {
        if (state.pipelineRunning) return;
        const reader = new FileReader();
        reader.onload = e => {
            state.uploadedImage = e.target.result;

            // Show image in upload area
            uploadArea.classList.add('has-image');
            uploadArea.innerHTML = `<img src="${state.uploadedImage}" alt="업로드 이미지">`;

            // Reset right panel
            gpxPlaceholder.style.display = 'flex';
            gpxOverlayImg.style.display  = 'none';
            gpxStats.style.display       = 'none';
            downloadGpxBtn.disabled      = true;
            state.gpxContent             = null;

            // Reset stage 1
            setStage(1, 'success', '업로드 완료');
            clearStageError(1);

            // Reset stages 2-4
            for (let i = 2; i <= 4; i++) {
                setStage(i, 'pending', '대기 중');
                clearStageError(i);
                setStageBody(i, '');
            }

            runPipeline();
        };
        reader.readAsDataURL(file);
    }

    // ── Pipeline ──────────────────────────────────────────────────────────────
    async function apiPost(url, body, isFormData = false) {
        const opts = { method: 'POST' };
        if (isFormData) {
            opts.body = body;
        } else {
            opts.headers = { 'Content-Type': 'application/json' };
            opts.body    = JSON.stringify(body);
        }
        const r = await fetch(url, opts);
        if (!r.ok) {
            let detail = `HTTP ${r.status}`;
            try {
                const err = await r.json();
                if (typeof err?.detail === 'string') detail = err.detail;
            } catch (_) {}
            throw new Error(detail);
        }
        return r.json();
    }

    async function runPipeline() {
        state.pipelineRunning = true;
        try {
            // Stage 2: predict (경로 추출)
            setStage(2, 'running', '모델 추론 중...', true);
            const blob2    = await fetch(state.uploadedImage).then(r => r.blob());
            const form2    = new FormData();
            form2.append('file', blob2, 'image.png');
            const d2       = await apiPost('/api/predict', form2, true);
            state.mask_b64 = d2.mask_b64;
            setStage(2, 'success', '경로 추출 완료');
            setStageBody(2, thumbHtml(state.mask_b64, '마스크'));

            // Stage 3: postprocess (후처리)
            setStage(3, 'running', '후처리 중...', true);
            const d3a          = await apiPost('/api/postprocess', { mask_b64: state.mask_b64 });
            state.skeleton_b64 = d3a.skeleton_b64;

            setStage(3, 'running', '경로 순서 결정 중...', true);
            const d3b = await apiPost('/api/auto_extract_path', {
                skeleton_b64:  state.skeleton_b64,
                input_img_b64: state.uploadedImage,
            });
            if (d3b.status !== 'success') throw new Error(d3b.message || '경로 추출 실패');

            state.start = d3b.start;
            state.end   = d3b.end;
            state.path  = d3b.path;

            setStage(3, 'success', '후처리 완료');
            setStageBody(3, thumbHtml(state.skeleton_b64, '스켈레톤'));

            // Stage 4: 경로 오버레이
            setStage(4, 'success', `경로 오버레이 · ${state.path.length.toLocaleString()}픽셀`);
            setStageBody(4, thumbHtml(d3b.overlay_b64, '경로 오버레이'));

            // GPX 생성
            const d6 = await apiPost('/api/convert_gpx', {
                start: state.start,
                end:   state.end,
                path:  state.path,
            });
            state.gpxContent        = d6.gpx_content;
            downloadGpxBtn.disabled = false;

            // Stats
            document.getElementById('statPoints').textContent = state.path.length.toLocaleString();
            document.getElementById('statStart').textContent  = `[${state.start[0]}, ${state.start[1]}]`;
            document.getElementById('statEnd').textContent    = `[${state.end[0]},   ${state.end[1]}]`;
            gpxStats.style.display = 'grid';

        } catch (err) {
            // Mark the furthest running stage as error
            ['4','3','2','1'].forEach(n => {
                const badge = document.getElementById(`badge${n}`);
                if (badge && badge.className.includes('running')) {
                    setStage(Number(n), 'error', '실패');
                    setStageError(Number(n), err.message);
                }
            });
            console.error('[pipeline]', err);
        } finally {
            state.pipelineRunning = false;
        }
    }

    // ── Right panel ───────────────────────────────────────────────────────────
    function showOverlay(src) {
        gpxPlaceholder.style.display = 'none';
        gpxOverlayImg.src            = src;
        gpxOverlayImg.style.display  = 'block';
    }

    // ── GPX download ──────────────────────────────────────────────────────────
    downloadGpxBtn.addEventListener('click', () => {
        if (!state.gpxContent) return;
        const blob = new Blob([state.gpxContent], { type: 'application/gpx+xml' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = 'route.gpx';
        a.click();
        URL.revokeObjectURL(url);
    });
</script>
</body>
</html>
